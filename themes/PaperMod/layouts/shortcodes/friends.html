<html>
 <head></head>
 <body>
  <div class="friend-links">
    {{ range .Site.Data.friends }} 
   <div class="friend-item" style="display: inline-block; margin: 10px; width: 250px;"> 
    <a href="{{ .link }}" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 10px; text-decoration: none;"> <img src="{{ .image }}" alt="{{ .title }}" style="width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0;" /> 
     <div style="text-align: left;"> 
      <div style="font-weight: bold;">
       {{ .title }}
      </div> 
      <div style="font-size: 12px; color: gray; margin-top: 5px;">
        {{ .intro }} 
      </div> 
     </div> </a> 
   </div> {{ end }} 
  </div>
 </body>
</html>
